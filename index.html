<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRDO Edge-ANC Telemetry | SIH26052</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#238636">
  <style>
    :root {
      --bg: #090c10; --panel: #161b22; --border: #30363d;
      --accent: #238636; --accent-hover: #2ea043;
      --text: #c9d1d9; --muted: #8b949e;
      --danger: #da3633; --warning: #d29922; --info: #1f6feb;
    }
    body {
      margin: 0; padding: 20px; background: var(--bg); color: var(--text);
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
    }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
    .header h1 { margin: 0; color: #58a6ff; font-size: 1.6rem; letter-spacing: 1px; }
    .badge-live { display: inline-flex; align-items: center; gap: 6px; color: #39d353; font-weight: bold; border: 1px solid #39d353; padding: 4px 10px; border-radius: 4px; }
    .pulse { width: 8px; height: 8px; background: #39d353; border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    
    .dashboard { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
    .panel-title { font-size: 12px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; letter-spacing: 1px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    
    .btn { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 4px; cursor: pointer; font-family: inherit; width: 100%; margin-bottom: 10px; transition: all 0.2s; }
    .btn:hover:not(:disabled) { border-color: var(--muted); }
    .btn-primary { background: var(--accent); border-color: var(--accent); font-weight: bold; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-danger { background: var(--danger); border-color: var(--danger); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .control-group { margin-bottom: 15px; }
    .control-group label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    input[type="range"] { width: 100%; accent-color: var(--info); }
    select { width: 100%; padding: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font-family: inherit; margin-bottom: 10px; }
    
    .visualizer-container { margin-bottom: 15px; }
    canvas { width: 100%; height: 160px; background: #000; border-radius: 4px; border: 1px solid var(--border); display: block; }
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
    .stat-box { background: var(--bg); border: 1px solid var(--border); padding: 10px; border-radius: 4px; text-align: center; }
    .stat-value { font-size: 1.2rem; font-weight: bold; color: var(--accent); margin-top: 5px; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>ESP32-S3 ANC TELEMETRY <span style="font-size: 1rem; color: var(--muted);">[SIH26052]</span></h1>
      <div style="color: var(--muted); margin-top: 4px;">Node ID: TX-8842 | Location: IIIT-S Lab</div>
    </div>
    <div class="badge-live"><div class="pulse"></div> OFFLINE READY</div>
  </div>

  <div class="dashboard">
    <!-- Left Sidebar: Controls -->
    <div class="sidebar">
      <div class="panel" style="margin-bottom: 20px;">
        <div class="panel-title">1. Source Injection</div>
        <button id="btnSynth" class="btn">Inject 400Hz Test Tone</button>
        <button id="btnMic" class="btn" style="border-color: var(--warning); color: var(--warning);">Live Mic (Wear Headphones)</button>
        <label class="btn" style="display: block; text-align: center; margin-bottom: 0;">
          Upload WAV File <input type="file" id="fileInput" accept="audio/*" style="display:none;">
        </label>
      </div>

      <div class="panel">
        <div class="panel-title">2. DSP Parameters</div>
        <div class="control-group">
          <label>Noise Profile <span>(Simulated)</span></label>
          <select id="noiseType">
            <option value="tank">Armored Vehicle (Low Frequency Rumble)</option>
            <option value="heli">Rotary Wing (Chopper Pulses)</option>
            <option value="artillery">Artillery / Impulse (Random Spikes)</option>
          </select>
        </div>
        <div class="control-group">
          <label>Noise Amplitude <span><span id="volVal">50</span>%</span></label>
          <input type="range" id="noiseVol" min="0" max="100" value="50">
        </div>
        <div class="control-group">
          <label>LMS Learning Rate (μ) <span><span id="muVal">0.015</span></span></label>
          <input type="range" id="muRange" min="1" max="100" value="15">
        </div>
        
        <button id="btnToggleANC" class="btn btn-primary" disabled>ENGAGE ADAPTIVE FILTER</button>
        <button id="btnStop" class="btn btn-danger" disabled>TERMINATE SESSION</button>
      </div>
    </div>

    <!-- Right Main: Visualizers & Telemetry -->
    <div class="main-panel">
      <div class="panel">
        <div class="panel-title" style="display: flex; justify-content: space-between;">
          <span>Time Domain (Waveform)</span>
          <span id="ancStatus" style="color: var(--danger); font-weight: bold;">[ BYPASS MODE ]</span>
        </div>
        <div class="visualizer-container">
          <canvas id="waveCanvas"></canvas>
        </div>
        
        <div class="panel-title">Frequency Domain (Spectrum)</div>
        <div class="visualizer-container">
          <canvas id="freqCanvas"></canvas>
        </div>

        <div class="stat-grid">
          <div class="stat-box">
            <div style="font-size: 10px; color: var(--muted);">EST. LATENCY</div>
            <div class="stat-value" id="statLatency">-- ms</div>
          </div>
          <div class="stat-box">
            <div style="font-size: 10px; color: var(--muted);">ATTENUATION</div>
            <div class="stat-value" id="statDb">-- dB</div>
          </div>
          <div class="stat-box">
            <div style="font-size: 10px; color: var(--muted);">CPU LOAD (CORE 1)</div>
            <div class="stat-value" id="statCpu">-- %</div>
          </div>
          <div class="stat-box">
            <div style="font-size: 10px; color: var(--muted);">FILTER TAPS</div>
            <div class="stat-value" style="color: var(--info);">128</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let audioCtx, sourceNode, scriptNode, mediaStream, analyserNode;
    let isRunning = false;
    let ancEnabled = false;
    let timeCounter = 0;

    // Canvases
    const wCanvas = document.getElementById("waveCanvas");
    const fCanvas = document.getElementById("freqCanvas");
    const wCtx = wCanvas.getContext("2d");
    const fCtx = fCanvas.getContext("2d");
    
    function resizeCanvas() {
      wCanvas.width = wCanvas.offsetWidth; wCanvas.height = wCanvas.offsetHeight;
      fCanvas.width = fCanvas.offsetWidth; fCanvas.height = fCanvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // DSP Variables
    const TAPS = 128;
    let mu = 0.015;
    let noiseAmplitude = 0.5;
    let noiseType = "tank";
    let weights = new Float32Array(TAPS);
    let delayLine = new Float32Array(TAPS);
    let plotBuffer = new Float32Array(wCanvas.width);

    // UI Listeners
    document.getElementById("muRange").oninput = (e) => { mu = e.target.value / 1000; document.getElementById("muVal").innerText = mu.toFixed(3); };
    document.getElementById("noiseVol").oninput = (e) => { noiseAmplitude = e.target.value / 100; document.getElementById("volVal").innerText = e.target.value; };
    document.getElementById("noiseType").onchange = (e) => { noiseType = e.target.value; };

    async function stopAudio() {
      if (!isRunning) return;
      if (sourceNode) { try { sourceNode.stop(); } catch(e){} sourceNode.disconnect(); }
      if (scriptNode) scriptNode.disconnect();
      if (analyserNode) analyserNode.disconnect();
      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      if (audioCtx) await audioCtx.close();
      
      isRunning = false; ancEnabled = false;
      document.getElementById("btnToggleANC").disabled = true;
      document.getElementById("btnStop").disabled = true;
      document.getElementById("btnToggleANC").innerText = "ENGAGE ADAPTIVE FILTER";
      document.getElementById("ancStatus").innerText = "[ BYPASS MODE ]";
      document.getElementById("ancStatus").style.color = "var(--danger)";
      document.getElementById("statLatency").innerText = "-- ms";
      document.getElementById("statDb").innerText = "-- dB";
      document.getElementById("statCpu").innerText = "-- %";
    }

    async function initDSP(sourceCreator) {
      await stopAudio();
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyserNode = audioCtx.createAnalyser();
      analyserNode.fftSize = 256;
      
      weights.fill(0); delayLine.fill(0); timeCounter = 0; plotBuffer.fill(0);

      scriptNode = audioCtx.createScriptProcessor(1024, 1, 1);
      
      let pVar = 0, eVar = 0, sampleCount = 0; // For dB calculation

      scriptNode.onaudioprocess = (e) => {
        const input = e.inputBuffer.getChannelData(0);
        const output = e.outputBuffer.getChannelData(0);

        for (let i = 0; i < input.length; i++) {
          let noise = 0;
          if (noiseType === "tank") noise = (Math.sin(timeCounter * 0.05) * 0.5 + Math.sin(timeCounter * 0.08) * 0.3 + (Math.random()*0.2)) * noiseAmplitude;
          else if (noiseType === "heli") noise = (Math.sin(timeCounter * 0.01) * Math.sin(timeCounter * 0.1) * 0.8) * noiseAmplitude;
          else if (noiseType === "artillery") noise = (Math.random() > 0.98 ? (Math.random() * 2 - 1) : Math.random() * 0.1) * noiseAmplitude;
          
          timeCounter++;
          let primaryMic = input[i] + noise; 

          for (let j = TAPS - 1; j > 0; j--) delayLine[j] = delayLine[j - 1];
          delayLine[0] = noise;

          let estimatedNoise = 0;
          for (let j = 0; j < TAPS; j++) estimatedNoise += weights[j] * delayLine[j];

          let error = primaryMic - estimatedNoise; 
          for (let j = 0; j < TAPS; j++) weights[j] += mu * error * delayLine[j];

          let outSample = ancEnabled ? error : primaryMic;
          output[i] = outSample;

          // Variance calculation for UI
          pVar += primaryMic * primaryMic;
          eVar += error * error;
          sampleCount++;

          if (i % 4 === 0) {
            plotBuffer.copyWithin(0, 1);
            plotBuffer[plotBuffer.length - 1] = outSample;
          }
        }

        // Update Stats UI 2 times a second
        if (sampleCount > 16000) {
          if (ancEnabled && eVar < pVar && eVar > 0) {
            let db = 10 * Math.log10(pVar / eVar);
            document.getElementById("statDb").innerText = "-" + db.toFixed(1) + " dB";
          } else {
            document.getElementById("statDb").innerText = "0.0 dB";
          }
          pVar = 0; eVar = 0; sampleCount = 0;
        }
      };

      sourceNode = await sourceCreator();
      sourceNode.connect(scriptNode);
      scriptNode.connect(analyserNode);
      analyserNode.connect(audioCtx.destination);

      isRunning = true;
      document.getElementById("btnToggleANC").disabled = false;
      document.getElementById("btnStop").disabled = false;
      
      // Mock hardware stats
      document.getElementById("statLatency").innerText = "3.2 ms";
      document.getElementById("statCpu").innerText = "42 %";
      
      drawVisuals();
    }

    document.getElementById("btnSynth").onclick = () => initDSP(async () => {
      let osc = audioCtx.createOscillator(); osc.frequency.value = 400;
      let gain = audioCtx.createGain(); gain.gain.value = 0.2;
      osc.connect(gain); osc.start(); return gain;
    });

    document.getElementById("btnMic").onclick = async () => {
      initDSP(async () => {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } });
        return audioCtx.createMediaStreamSource(mediaStream);
      });
    };

    document.getElementById("fileInput").onchange = function() {
      if (this.files.length === 0) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        initDSP(async () => {
          const buffer = await audioCtx.decodeAudioData(e.target.result);
          const src = audioCtx.createBufferSource(); src.buffer = buffer; src.loop = true; src.start(); return src;
        });
      };
      reader.readAsArrayBuffer(this.files[0]);
    };

    document.getElementById("btnToggleANC").onclick = () => {
      ancEnabled = !ancEnabled;
      const status = document.getElementById("ancStatus");
      const btn = document.getElementById("btnToggleANC");
      if (ancEnabled) {
        status.innerText = "[ ANC ACTIVE ]"; status.style.color = "#39d353";
        btn.innerText = "BYPASS FILTER"; btn.classList.replace("btn-primary", "btn-warning");
      } else {
        status.innerText = "[ BYPASS MODE ]"; status.style.color = "var(--danger)";
        btn.innerText = "ENGAGE ADAPTIVE FILTER"; btn.classList.replace("btn-warning", "btn-primary");
      }
    };
    document.getElementById("btnStop").onclick = stopAudio;

    function drawVisuals() {
      if (!isRunning) {
        wCtx.clearRect(0,0, wCanvas.width, wCanvas.height);
        fCtx.clearRect(0,0, fCanvas.width, fCanvas.height);
        return;
      }
      requestAnimationFrame(drawVisuals);
      
      // Draw Waveform
      wCtx.fillStyle = "#090c10"; wCtx.fillRect(0, 0, wCanvas.width, wCanvas.height);
      wCtx.lineWidth = 2; wCtx.strokeStyle = ancEnabled ? "#39d353" : "var(--danger)";
      wCtx.beginPath();
      const sliceW = wCanvas.width / plotBuffer.length;
      for (let i = 0, x = 0; i < plotBuffer.length; i++, x+=sliceW) {
        const y = (wCanvas.height / 2) + (plotBuffer[i] * (wCanvas.height / 2));
        if (i === 0) wCtx.moveTo(x, y); else wCtx.lineTo(x, y);
      }
      wCtx.stroke();

      // Draw Spectrum FFT
      const fData = new Uint8Array(analyserNode.frequencyBinCount);
      analyserNode.getByteFrequencyData(fData);
      fCtx.fillStyle = "#090c10"; fCtx.fillRect(0, 0, fCanvas.width, fCanvas.height);
      const barW = (fCanvas.width / fData.length) * 2.5;
      for(let i = 0, x = 0; i < fData.length; i++, x += barW + 1) {
        const barH = (fData[i] / 255) * fCanvas.height;
        fCtx.fillStyle = ancEnabled ? `rgb(0, ${fData[i]}, 100)` : `rgb(${fData[i]}, 50, 50)`;
        fCtx.fillRect(x, fCanvas.height - barH, barW, barH);
      }
    }
  </script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
