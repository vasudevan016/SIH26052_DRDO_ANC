<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRDO SIH26052 | Edge-ANC Simulation</title>
  <style>
    body {
      margin: 0; padding: 24px; background: #0d1117; color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center;
    }
    .container { max-width: 800px; width: 100%; }
    h1 { color: #58a6ff; font-size: 1.5rem; margin-bottom: 4px; text-transform: uppercase; }
    .badge { background: #238636; color: #fff; padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
    .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-top: 16px; }
    canvas { width: 100%; height: 180px; background: #000; border-radius: 6px; display: block; margin-top: 12px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
    button, .file-upload { 
      background: #238636; color: #fff; border: none; padding: 10px 18px; 
      border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
      text-align: center; display: inline-block;
    }
    button:disabled { background: #30363d; cursor: not-allowed; color: #8b949e; }
    .btn-toggle { background: #1f6feb; }
    .btn-stop { background: #da3633; }
    .btn-source { background: #21262d; border: 1px solid #30363d; }
    .btn-source:hover:not(:disabled) { background: #30363d; }
    .stat { font-family: monospace; font-size: 0.9rem; color: #7ee787; }
    .warning { color: #d29922; font-size: 0.85rem; margin-top: 8px; font-weight: bold; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h1>DRDO ANC Virtual Node <span style="font-size:0.9rem; color:#8b949e;">[SIH26052]</span></h1>
      <span class="badge">LMS DSP Simulation</span>
    </div>
    <p style="color:#8b949e; margin-top:2px;">Real-time Normalized Least Mean Squares (NLMS) acoustic filtering pipeline.</p>

    <!-- Source Selection -->
    <div class="panel">
      <strong>1. Select Audio Input Source</strong>
      <div class="controls">
        <button id="btnSynth" class="btn-source">Synthetic Voice</button>
        <button id="btnMic" class="btn-source">Live Microphone</button>
        <label class="file-upload btn-source">
          Upload Audio File <input type="file" id="fileInput" accept="audio/*" style="display:none;">
        </label>
      </div>
      <div id="micWarning" class="warning">⚠️ Wear headphones to prevent audio feedback loop!</div>
    </div>

    <!-- Oscilloscope and Filter Control -->
    <div class="panel">
      <div style="display:flex; justify-content:space-between;">
        <strong>Live Waveform Monitor</strong>
        <span id="ancStatus" class="stat">MODE: ANC ACTIVE (FILTERING)</span>
      </div>
      <canvas id="scopeCanvas"></canvas>

      <div class="controls">
        <button id="btnToggleANC" class="btn-toggle" disabled>Bypass Filter (Hear Raw Noise)</button>
        <button id="btnStop" class="btn-stop" disabled>Stop Audio</button>
      </div>
    </div>
  </div>

  <script>
    let audioCtx, sourceNode, scriptNode, mediaStream;
    let isRunning = false;
    let ancEnabled = true;
    let timeCounter = 0;

    const canvas = document.getElementById("scopeCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    // Filter Parameters
    const TAPS = 64;
    const mu = 0.015;
    let weights = new Float32Array(TAPS);
    let delayLine = new Float32Array(TAPS);
    let plotBuffer = new Float32Array(canvas.width);

    // Stop current audio session
    async function stopAudio() {
      if (!isRunning) return;
      if (sourceNode) {
        try { sourceNode.stop(); } catch (e) {}
        sourceNode.disconnect();
      }
      if (scriptNode) scriptNode.disconnect();
      if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
      if (audioCtx) await audioCtx.close();
      
      isRunning = false;
      document.getElementById("btnToggleANC").disabled = true;
      document.getElementById("btnStop").disabled = true;
      document.getElementById("micWarning").style.display = "none";
    }

    async function initDSP(sourceCreator) {
      await stopAudio();
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      // Reset filter state
      weights.fill(0); delayLine.fill(0); timeCounter = 0; plotBuffer.fill(0);

      // Create Custom C++ Style LMS Processor
      scriptNode = audioCtx.createScriptProcessor(512, 1, 1);
      scriptNode.onaudioprocess = (e) => {
        const input = e.inputBuffer.getChannelData(0); // Clean speech
        const output = e.outputBuffer.getChannelData(0);

        for (let i = 0; i < input.length; i++) {
          // 1. Generate synthetic battlefield noise (rumble + hiss)
          let engineNoise = (Math.sin(timeCounter * 0.08) * 0.4) + ((Math.random() * 2 - 1) * 0.25);
          timeCounter++;

          // 2. Mix speech with noise (simulating primary mic)
          let primaryMic = input[i] + engineNoise; 

          // 3. Shift delay line for reference noise
          for (let j = TAPS - 1; j > 0; j--) delayLine[j] = delayLine[j - 1];
          delayLine[0] = engineNoise;

          // 4. LMS Adaptive Filter Math
          let estimatedNoise = 0;
          for (let j = 0; j < TAPS; j++) estimatedNoise += weights[j] * delayLine[j];

          let error = primaryMic - estimatedNoise; // Cleaned signal

          for (let j = 0; j < TAPS; j++) {
            weights[j] += mu * error * delayLine[j]; // Update weights
          }

          let outSample = ancEnabled ? error : primaryMic;
          output[i] = outSample;

          // Plotting
          if (i % 4 === 0) {
            plotBuffer.copyWithin(0, 1);
            plotBuffer[plotBuffer.length - 1] = outSample;
          }
        }
      };

      sourceNode = await sourceCreator();
      sourceNode.connect(scriptNode);
      scriptNode.connect(audioCtx.destination);

      isRunning = true;
      document.getElementById("btnToggleANC").disabled = false;
      document.getElementById("btnStop").disabled = false;
      drawWaveform();
    }

    // Source 1: Synthetic
    document.getElementById("btnSynth").onclick = () => initDSP(async () => {
      let osc = audioCtx.createOscillator();
      osc.frequency.value = 400;
      let gain = audioCtx.createGain();
      gain.gain.value = 0.15;
      osc.connect(gain);
      osc.start();
      return gain;
    });

    // Source 2: Live Mic
    document.getElementById("btnMic").onclick = async () => {
      document.getElementById("micWarning").style.display = "block";
      initDSP(async () => {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } });
        return audioCtx.createMediaStreamSource(mediaStream);
      });
    };

    // Source 3: Audio File
    document.getElementById("fileInput").onchange = function() {
      if (this.files.length === 0) return;
      const file = this.files[0];
      const reader = new FileReader();
      reader.onload = async (e) => {
        initDSP(async () => {
          const audioBuffer = await audioCtx.decodeAudioData(e.target.result);
          const bufferSource = audioCtx.createBufferSource();
          bufferSource.buffer = audioBuffer;
          bufferSource.loop = true;
          bufferSource.start();
          return bufferSource;
        });
      };
      reader.readAsArrayBuffer(file);
    };

    // UI Controls
    document.getElementById("btnToggleANC").onclick = () => {
      ancEnabled = !ancEnabled;
      const status = document.getElementById("ancStatus");
      const btn = document.getElementById("btnToggleANC");
      if (ancEnabled) {
        status.innerText = "MODE: ANC ACTIVE (FILTERING)"; status.style.color = "#7ee787"; btn.innerText = "Bypass Filter (Hear Raw Noise)";
      } else {
        status.innerText = "MODE: BYPASS (RAW NOISE EXPOSED)"; status.style.color = "#f85149"; btn.innerText = "Engage LMS Filter";
      }
    };

    document.getElementById("btnStop").onclick = stopAudio;

    function drawWaveform() {
      if (!isRunning) return;
      requestAnimationFrame(drawWaveform);
      ctx.fillStyle = "#040d06"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 2; ctx.strokeStyle = ancEnabled ? "#39d353" : "#f85149";
      ctx.beginPath();
      const sliceWidth = canvas.width / plotBuffer.length;
      let x = 0;
      for (let i = 0; i < plotBuffer.length; i++) {
        const y = (canvas.height / 2) + (plotBuffer[i] * (canvas.height / 2));
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        x += sliceWidth;
      }
      ctx.stroke();
    }
  </script>
</body>
</html>
